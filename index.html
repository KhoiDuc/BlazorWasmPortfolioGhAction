<body>
    <style>
        body {
            background-color: #0a0a0f;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        .loadingPageContainer {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 60%), #0a0a0f;
            color: #f1f5f9;
            text-align: center;
            padding: 20px;
        }

        .loadingAvatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(99, 102, 241, 0.4);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.25);
            margin-bottom: 24px;
            object-fit: cover;
        }

        .loadingTitle {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f1f5f9 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loadingSubtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            max-width: 420px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .loader {
            height: 4px;
            width: 240px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        .loader .loaderBar {
            position: absolute;
            top: 0;
            bottom: 0;
            border-radius: 9999px;
            background: linear-gradient(90deg, #6366f1, #22d3ee);
            animation: borealisBar 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes borealisBar {
            0% {
                left: -40%;
                width: 40%;
            }
            50% {
                left: 30%;
                width: 50%;
            }
            100% {
                left: 100%;
                width: 40%;
            }
        }
    </style>
    <div id="app">
        <div class="loadingPageContainer">
            <img src="images/avt-men.png" alt="Khoi Nguyen" class="loadingAvatar" />
            <div class="loadingTitle">Khoi Duc Portfolio</div>
            <div class="loadingSubtitle">Initializing interactive workspace &amp; resources...</div>
            <div class="loader">
                <div class="loaderBar"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
