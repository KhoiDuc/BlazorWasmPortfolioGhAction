<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khoi Nguyen Minh Duc - Portfolio .NET Developer với dự án, tiện ích và CV." />
    <title>Khoi Duc - Portfolio .NET Developer</title>
    <base href="/BlazorWasmPortfolioGhAction/" />
    <script>
        (function () {
            var t = 'light';
            try { var s = localStorage.getItem('portfolio-theme'); if (s === 'dark' || s === 'light') t = s; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t);
            var c = 'vi';
            try {
                var lc = localStorage.getItem('app-culture');
                if (lc) {
                    lc = String(lc).toLowerCase();
                    if (lc === 'en' || lc.indexOf('en-') === 0) c = 'en';
                }
            } catch (e) {}
            document.documentElement.setAttribute('lang', c);
        })();
    </script>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/trading.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/diagram-panel.css" />
    <link rel="stylesheet" href="css/svg-diagram.css" />
    <link href="BlazorWasmPortfolioGhAction.styles.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="manifest.json" rel="manifest" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon/favicon.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png">
    <link rel="icon" sizes="192x192" href="images/favicon/android-chrome-192x192.png">
    <link rel="icon" sizes="512x512" href="images/favicon/android-chrome-512x512.png">
    <script type="application/ld+json" src="schema.json"></script>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading-screen" role="status" aria-live="polite" aria-label="Loading Khoi Duc portfolio">
            <div class="loading-pattern" aria-hidden="true"></div>
            <div class="loading-content">
                <div class="loading-brand" aria-hidden="true">
                    <span class="loading-brand-symbol">&lt;/</span>
                    <span class="loading-brand-name">khoi</span>
                    <span class="loading-brand-symbol">&gt;</span>
                </div>
                <p class="loading-role">.NET DEVELOPER</p>
                <p class="loading-title">Loading portfolio</p>
                <p class="loading-description">Preparing the experience...</p>
                <div class="loading-status">
                    <div class="loading-progress" aria-hidden="true">
                        <div class="loading-progress-bar"></div>
                    </div>
                    <div class="loading-progress-meta">
                        <span>Blazor WebAssembly</span>
                        <span class="loading-progress-text"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" role="alert">
        <div class="error-screen">
            <div class="error-pattern" aria-hidden="true"></div>
            <div class="error-card">
                <div class="error-brand" aria-hidden="true">
                    <span class="error-brand-symbol">&lt;/</span>
                    <span>khoi</span>
                    <span class="error-brand-symbol">&gt;</span>
                </div>
                <p class="error-label">PORTFOLIO ERROR</p>
                <p class="error-title">Something went wrong.</p>
                <p class="error-description">The portfolio couldn't finish loading correctly. Reload the page to try again.</p>
                <div class="error-actions">
                    <a href="" class="reload error-reload">
                        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
                        Reload portfolio
                    </a>
                    <span class="dismiss error-dismiss" role="button" tabindex="0" aria-label="Dismiss error message">Dismiss</span>
                </div>
                <div class="error-footer">
                    <i class="bi bi-code-slash" aria-hidden="true"></i>
                    <span>Blazor WebAssembly · .NET 10</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Third-party libraries (core only; route-specific libs loaded via script-loader.js) -->
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>

    <!-- Blazor extension scripts -->
    <script src="_content/Blazor.Extensions.Canvas/blazor.extensions.canvas.js"></script>
    <!-- MSAL disabled — was for learning only
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    -->
    <!-- TinyMCE.Blazor wrapper (TinyMCE core loaded via CDN above) -->
    <script src="_content/TinyMCE.Blazor/tinymce-blazor.js"></script>

    <!-- Google Maps dependencies -->
    <script src="_content/BlazorGoogleMaps/js/objectManager.js"></script>
    <script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

    <!-- SVG Diagram components -->
    <script src="js/svg-diagram/Rectangle.js"></script>
    <script src="js/svg-diagram/SvgDiagramGrid.js"></script>
    <script src="js/svg-diagram/SvgDiagramSelectionControls.js"></script>
    <script src="js/svg-diagram/SvgDiagramMovingControls.js"></script>
    <script src="js/svg-diagram/ShapeGenerator.js"></script>
    <script src="js/svg-diagram/SvgDiagram.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/culture.js"></script>
    <script src="js/script-loader.js"></script>
    <script src="js/tinymce-loader.js"></script>
    <script src="js/emailjs-bridge.js"></script>

    <!-- Application scripts -->
    <script src="js/cryptoChart.js"></script>
    <script src="js/trading.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/CalcDrag.js"></script>
    <script src="js/carouselHelper.js"></script>
    <script src="js/customRefresh.js"></script>
    <script src="js/app.js"></script>

    <!-- Blazor framework (MUST COME LAST BEFORE SERVICE WORKER) -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Portfolio motion animations -->
    <script src="js/animations.js"></script>

    <!-- Service Worker Registration -->
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
